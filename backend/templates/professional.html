<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
  margin: 0;
  font-family: Arial;
  background: #ddd;
}

.container {
  width: 900px;
  margin: auto;
  display: flex;
  background: white;
}

.left {
  width: 35%;
  background: #2f3e50;
  color: white;
  padding: 30px;
  text-align: center;
}

.left img {
  width: 120px;
  border-radius: 50%;
  margin-bottom: 20px;
}

.right {
  width: 65%;
  padding: 40px;
}

h1 {
  margin-top: 0;
}

.section {
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="container">

<div class="left">
  <img src="{{photo}}" />
  <h2>{{name}}</h2>
</div>

<div class="right">
  <div class="section">
    {{content}}
  </div>
</div>

</div>

</body>
</html>
